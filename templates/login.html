{% extends 'base.html' %}
{% block header %}
    {{ super() }}
{% endblock %}
{% block main %}
    <h2>Login</h2>

    <form method="post" action="" novalidate>
        {{ form.hidden_tag() }}    
        <div>
            {{ form.email.label }}
            {{ form.email(size=35) }}
        </div>
        
        <div>
            {{ form.password.label }}
            {{ form.password(size=35) }}
        </div>
    
        <div>
            {{ form.submit() }}
        </div>

    </form>

{% endblock %}
